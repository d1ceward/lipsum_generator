<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <title>Simple Lorem Ipsum Generator</title>
    <link rel="stylesheet" media="all" href="popup.css">
  </head>
  <body>
    <!-- The inline text is the English fallback; localize() swaps it for the
         viewer's locale on load. A test keeps the two in step. -->
    <div class="controls">
      <span class="form-text" data-i18n="labelGenerate">Generate</span>

      <label class="visually-hidden" for="paragraph-count" data-i18n="a11yParagraphCount">Number of paragraphs</label>
      <input class="number-input" id="paragraph-count" name="paragraph-count" type="number" inputmode="numeric">

      <span class="form-text" data-i18n="labelParagraphsOf">paragraph(s) of</span>

      <label class="visually-hidden" for="paragraph-length" data-i18n="a11yParagraphLength">Length of each paragraph</label>
      <input class="number-input" id="paragraph-length" name="paragraph-length" type="number" inputmode="numeric">

      <label class="visually-hidden" for="length-unit" data-i18n="a11yLengthUnit">Length unit</label>
      <select class="selectbox" id="length-unit" name="length-unit">
        <option value="sentences" data-i18n="unitSentences">sentences</option>
        <option value="words" data-i18n="unitWords">words</option>
      </select>

      <label class="checkbox-label" for="html-tags">
        <input id="html-tags" name="html-tags" type="checkbox">
        <span data-i18n="labelHtmlTags">HTML tags</span>
      </label>
    </div>

    <div class="scroll-container">
      <label class="visually-hidden" for="content-area" data-i18n="a11yOutput">Generated lorem ipsum text</label>
      <textarea id="content-area" name="content-area" spellcheck="false"></textarea>
    </div>

    <div class="footer">
      <div class="footer-left">
        <button class="button" id="copy-button" type="button" data-i18n="buttonCopy">Copy</button>
        <button class="button" id="regenerate-button" type="button" data-i18n="buttonRegenerate">Regenerate</button>
      </div>
      <div class="footer-right">
        <a href="https://github.com/d1ceward/lipsum_generator" target="_blank" rel="noopener noreferrer" data-i18n="footerLink">SLIG on Github</a>
        - v<span id="version"></span>
      </div>
    </div>

    <div class="visually-hidden" id="status" role="status" aria-live="polite"></div>

    <script type="module" src="popup.js"></script>
  </body>
</html>
